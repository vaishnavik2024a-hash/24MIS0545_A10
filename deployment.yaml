apiVersion: apps/v1
kind: Deployment
metadata:
  name: water-monitoring-app
  labels:
    app: water-monitor
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: water-monitor
  template:
    metadata:
      labels:
        app: water-monitor
    spec:
      containers:
      - name: web-dashboard
        # Replace 'your-dockerhub-username' with your actual username
        image: your-dockerhub-username/water-monitor:latest
        ports:
        - containerPort: 80
        imagePullPolicy: Always
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: water-monitoring-service
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  selector:
    app: water-monitor
